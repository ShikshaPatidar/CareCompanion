[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carecompanion"
version = "0.1.0"
description = "CareCompanion: a safety-first healthcare service assistant built on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "azure-identity>=1.19",
  "azure-ai-projects>=2.0",
  "azure-ai-contentunderstanding>=1.0",
  "agent-framework-core>=1.19",
  "agent-framework-foundry>=1.13",
  "agent-framework-orchestrations>=1.2",
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
telemetry = ["azure-monitor-opentelemetry>=1.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
carecompanion = "carecompanion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["azure: constructs Azure/agent objects offline (no network calls)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
